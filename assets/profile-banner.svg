<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Sakshi Taragi animated developer banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"><animate attributeName="stop-color" values="#0f172a;#111827;#0f172a" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="50%"><animate attributeName="stop-color" values="#312e81;#0e7490;#312e81" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%"><animate attributeName="stop-color" values="#0f172a;#172554;#0f172a" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#67e8f9" stop-opacity=".55"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="180" cy="80" r="130" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="180;330;180" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;220;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="250" r="150" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="1030;870;1030" dur="8s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="#67e8f9" stroke-opacity=".28">
    <path d="M0 250 Q250 120 500 250 T1000 250 T1400 250" stroke-width="2">
      <animate attributeName="d" values="M0 250 Q250 120 500 250 T1000 250 T1400 250;M0 220 Q250 330 500 220 T1000 220 T1400 220;M0 250 Q250 120 500 250 T1000 250 T1400 250" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#a5f3fc">
    <circle cx="90" cy="45" r="3"><animate attributeName="cy" values="45;270;45" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="65" r="4"><animate attributeName="cy" values="65;285;65" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="40" r="2"><animate attributeName="cy" values="40;240;40" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="275" r="3"><animate attributeName="cy" values="275;50;275" dur="8s" repeatCount="indefinite"/></circle>
  </g>
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="white" filter="url(#shadow)">
    <text x="600" y="125" font-size="52" font-weight="700">Sakshi Taragi</text>
    <text x="600" y="170" font-size="22" fill="#a5f3fc">Computer Science • Web • Database • OOP • AI</text>
    <text x="600" y="215" font-size="16" fill="#cbd5e1">Building • Learning • Improving</text>
  </g>
  <rect x="390" y="245" width="420" height="3" rx="2" fill="#67e8f9">
    <animate attributeName="width" values="80;420;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="560;390;560" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>